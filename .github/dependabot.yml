version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases age a week (security updates skip this)
    groups:
      github-actions-patch:
        patterns: ["*"]
        update-types: [patch]
      github-actions-minor-and-major:
        patterns: ["*"]
        update-types: [minor, major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases age a week (security updates skip this)
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: [patch]
      npm-minor:
        patterns: ["*"]
        update-types: [minor]
