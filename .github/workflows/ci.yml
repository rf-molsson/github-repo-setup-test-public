name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: read # for the code scanning alert check
    steps:
      # Newer CodeQL queries can find problems in code that is already merged, which
      # PR checks never see. Block every PR until those alerts are fixed or dismissed.
      - name: Fail if the default branch has open high/critical code scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! alerts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/$DEFAULT_BRANCH&per_page=100" \
              --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | "\(.rule.security_severity_level): \(.rule.description) \(.html_url)"' \
              2>"$RUNNER_TEMP/err.txt"); then
            if grep -qiE 'no analysis found|must be enabled|not enabled' "$RUNNER_TEMP/err.txt"; then
              echo "::warning::Code scanning is not set up for this repository, skipping the alert check"
              exit 0
            fi
            cat "$RUNNER_TEMP/err.txt" >&2
            exit 1
          fi
          if [ -n "$alerts" ]; then
            echo "::error::The default branch has open high/critical code scanning alerts"
            echo "$alerts"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Test
        run: |
          pnpm run test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the summary when the review fails
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
